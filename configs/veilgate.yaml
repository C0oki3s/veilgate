listen: ":8080"
upstream: "http://localhost:3000"

# Modes:
#   observe   - score but never divert. Use this for week 1 to tune thresholds.
#   challenge - serve JS/PoW challenge to medium-score clients.
#   tarpit    - divert high-score clients to the shadow app.
#   auto      - below challenge -> upstream; middle band -> challenge; high score -> tarpit.
mode: "observe"

# External rule files. Leave empty to use the embedded defaults shipped with
# the binary. Set to ~/.veilgate/rules (the default for `veilgate update-rules`)
# to use community rules without a rebuild.
# Files consumed: detector.yaml, tls_fingerprints.yaml, payloads.yaml, and more.
rules_dir: "~/.veilgate/rules"

# Capture: legacy JSONL firehose. Superseded by `persist:` below — leave
# `capture.enabled: false` unless you're running a non-SQLite collection
# pipeline and still need the old firehose format.
capture:
  enabled: false
  path: "./data/requests.jsonl"
  max_mb: 100

# Persist: SQLite event store. Feeds the online ML classifier, and the
# miner reads `features_rollup` to propose new detector rules.
#
# Trim runs every 6 hours; rows older than `retention_days` are dumped to
# `dump_path` as gzipped CSV (one file per trim pass) before deletion.
# Set `dump_path: ""` to skip the CSV dump and just trim.
persist:
  enabled: true
  path: "./data/events.db"
  retention_days: 30
  queue_size: 4096
  dump_path: "./data/dumps"
  cache_size_kb: 65536  # 64 MB SQLite page cache

# TLS: enable to get JA3/JA4 TLS fingerprinting as an additional signal.
# When enabled, VeilGate terminates TLS itself so it can see the ClientHello.
# Generate a self-signed cert for testing with:
#   openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes -subj "/CN=localhost"
tls:
  enabled: false
  cert_file: "cert.pem"
  key_file: "key.pem"

detector:
  score_tarpit_threshold: 60
  score_challenge_threshold: 30
  window_seconds: 90
  trusted_ips: []   # exact IPs to never score. Do NOT add 127.0.0.1 when smoke-testing tools from localhost.
  # Comma-separated CIDR list of proxies whose X-Forwarded-For we respect.
  # Leave empty to only trust the direct RemoteAddr (stops XFF header injection).
  trusted_proxies: []
  probe_paths:
    - "/admin-panel-v2"
    - "/api/internal/debug"
    - "/.git/config"
    - "/.env.backup"
    - "/wp-admin-old"
    - "/phpmyadmin-backup"
    - "/api/v3/legacy-auth"

tarpit:
  min_latency_ms: 500
  max_latency_ms: 3000
  max_body_bytes: 102400

# Explicit upload routes. Uncomment and tune for endpoints that are allowed
# to receive large request bodies. VeilGate checks these before proxying but
# does not parse or scan file bytes.
# upload_policies:
#   - name: "user-files"
#     paths:
#       - "/api/upload"
#       - "/api/upload/*"
#     methods: ["POST", "PUT"]
#     max_body_bytes: 104857600 # 100 MiB
#     allowed_content_types:
#       - "multipart/form-data"
#       - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
#       - "application/vnd.ms-excel"
#       - "application/pdf"
#       - "image/"
#     require_auth: true
#     verifier_policy: "skip_body_hmac"
#     upstream_response_timeout: "5m"

metrics:
  listen: ":9090"
  # api_key: "change-me"   # protect /api/* endpoints with a bearer token

# Telemetry: remote observability export via OTLP/HTTP.
# Works with any OTel-compatible backend out of the box:
#   SigNoz, Grafana Cloud, Honeycomb, Datadog, Jaeger, a local
#   OpenTelemetry Collector, or any Prometheus + OTel bridge.
#
# Traces are on by default when an endpoint is set.
# Logs and metrics push are opt-in (see below).
#
# telemetry:
#   otlp:
#     # Base URL of the OTLP/HTTP receiver (no path suffix needed).
#     endpoint: "https://ingest.us2.signoz.cloud:443"
#
#     # Headers sent on every request — use for API keys or auth tokens.
#     # Examples:
#     #   SigNoz:     signoz-access-token: "your-key"
#     #   Honeycomb:  x-honeycomb-team: "your-key"
#     #   Grafana:    authorization: "Bearer glc_..."
#     #   Datadog:    dd-api-key: "your-key"
#     headers:
#       signoz-access-token: "your-key"
#
#     # Set true for plain http:// endpoints (local dev, docker-compose).
#     insecure: false
#
#   traces:
#     # Set disabled: true to suppress traces even when endpoint is set.
#     disabled: false
#     # Fraction of requests to sample (0.0–1.0). Default: 0.01 (1 %).
#     # Use 1.0 in dev; keep <= 0.05 on high-traffic production instances.
#     sample_rate: 0.01
#
#   logs:
#     # Forward every zerolog line to the OTLP endpoint as a structured
#     # LogRecord. Stderr output is unaffected — no lines are lost.
#     enabled: false
#
#   metrics_push:
#     # Push OTel metrics to the endpoint on a fixed interval.
#     # The existing Prometheus pull endpoint (/metrics) keeps working.
#     enabled: false
#     # Accepts Go duration strings: "30s", "1m", "5m", "1h". Default: "30s".
#     interval: "30s"
