name: Trigger Vercel redeploy on docs change

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

jobs:
  deploy:
    name: Trigger Vercel deploy hook
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel deploy hook
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error
