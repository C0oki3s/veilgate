name: CI

on:
  # Doc-only changes (anything under docs/ or any *.md / LICENSE / .gitignore)
  # skip CI -- they don't change the binary the image runs. workflow_dispatch
  # remains available if you ever need to force a run for a docs-only commit.
  # Tags are handled by release.yml (GoReleaser + Docker).
  push:
    branches:
      - main
      - master
      - dev
      - maintain
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test and Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Pull latest community rules
        run: |
          rm -rf veilgate-rules
          mkdir -p veilgate-rules
          TAG=$(curl -fsSL https://api.github.com/repos/C0oki3s/veilgate-rules/releases/latest \
            | grep '"tag_name"' | head -1 | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
          echo "Installing veilgate-rules ${TAG}"
          curl -fsSL "https://github.com/C0oki3s/veilgate-rules/archive/refs/tags/${TAG}.tar.gz" \
            | tar -xz --strip-components=1 -C veilgate-rules/

      - name: Run tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Build binary
        run: go build -o veilgate ./cmd/veilgate

  docker:
    name: Docker Build and Publish
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
