# Per-client fake identity pools. A profile picks one of each at create time
# using a deterministic seed hash (see internal/tarpit/profile.go), so every
# request from the same client keeps seeing the same fake reality.
#
# Pools are hot-reloadable, but existing profiles keep whatever they already
# selected — new clients will draw from the updated lists.
versions:
  - "Apache/2.4.41 (Ubuntu)"
  - "nginx/1.18.0"
  - "nginx/1.20.2"
  - "Apache/2.4.54 (Debian)"
  - "nginx/1.24.0"
  - "Microsoft-IIS/10.0"

