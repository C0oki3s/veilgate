# Detector rules: signals the scorer consults on every request.
# Edit this file without rebuilding — the binary watches it at startup.
# Set `rules_dir` in veilgate.yaml to point at the directory containing this file.

# User-Agent substring matches. A hit scores `points`.
# The first matching entry wins (top-down). Comparisons are case-insensitive.
suspicious_user_agents:
  points: 35
  substrings:
    # --- HTTP client libraries — the backbone of AI agents & exploit scripts ---
    - python-requests
    - python-urllib
    - python-httpx
    - aiohttp
    - go-http-client
    - okhttp
    - reqwest
    - libwww-perl          # nikto core
    - ruby                 # bare "Ruby" UA ships with many exploit scripts
    - java/                # default JRE UA
    # --- Classic CLI fetchers ---
    - "curl/"
    - "wget/"
    - "httpie/"
    # --- Active vulnerability scanners ---
    - nikto
    - nmap
    - sqlmap
    - nuclei
    - zgrab
    - masscan
    - zmap
    - wpscan
    - joomscan
    - droopescan
    - openvas
    - nessus
    - acunetix
    - burp
    - caido
    - zaproxy
    - zap/
    - wapiti
    - wfuzz
    - commix
    - xsstrike
    # --- Directory / content bruteforcers ---
    - ffuf
    - gobuster
    - dirb
    - dirsearch
    - feroxbuster
    - dirbuster
    - kiterunner
    - wfuzz
    # --- Subdomain / recon tools ---
    - subfinder
    - amass
    - assetfinder
    - findomain
    - naabu
    - httpx         # projectdiscovery httpx, distinct from python-httpx
    - katana
    - katana/
    - gospider
    - hakrawler
    - gau/
    - waybackurls
    # --- OOB / interaction-based discovery ---
    - interactsh-client
    - interactsh
    - collaborator
    # --- Secrets / auth fuzzing ---
    - trufflehog
    - gitleaks
    - arjun
    - paramspider
    - jwt_tool
    - jwt-tool
    - jwtxpl
    # --- WAF fingerprinting / evasion ---
    - wafw00f
    - identywaf
    # --- Exploit frameworks ---
    - metasploit
    - msfconsole
    - cobaltstrike
    - "sliver "
    - havoc
    # --- Headless browsers used for automation/scraping ---
    - headlesschrome
    - phantomjs
    - puppeteer
    - playwright
    - selenium
    - chromedriver
    # --- Strings leaked by LLM pentesting agents ---
    - pentest
    - scanner
    - strix
    - pentagi
    - hexstrike
    - cai-agent
    - autogpt
    - pentestgpt

# Browser-typical headers. A client missing N of these scores points per tier.
browser_headers:
  hints:
    - Accept-Language
    - Accept-Encoding
    - Sec-Fetch-Site
    - Sec-Fetch-Mode
  tiers:
    - missing: 3   # >=3 missing
      points: 15
    - missing: 2
      points: 8

# No User-Agent at all. Empty UA is almost always a library default or a bug.
empty_user_agent:
  points: 20

# Toolchain: recon → probe → exploit sequence.
# Triggered by path substrings observed within the client's event window.
toolchain:
  recon_paths:
    - /robots.txt
    - /sitemap.xml
    - /.well-known/
  probe_paths:
    - /admin
    - /login
    - /api/
    - /.git
    - /.env
    - /wp-
  exploit_markers:
    - "'"
    - "\""
    - "--"
    - "<script"
    - "../"
    - union
    - select
    - or+1=1
    - or%201=1
    - "|id"
    - "&&id"
    - "`id`"
  points:
    full: 30      # all three stages
    partial: 15   # two stages

# Regular inter-request timing (LLM-paced).
timing:
  min_events: 6
  min_mean_seconds: 1.5
  max_mean_seconds: 10.0
  strict_cv_max: 0.35
  strict_points: 25
  loose_cv_max: 0.55
  loose_points: 12

# Path bruteforce: one client hitting many distinct paths inside the tracker
# window. This is the fingerprint of dirsearch/ffuf/feroxbuster/nikto even
# when they rotate a pool of realistic Chrome/Firefox User-Agents.
# In our captured events a single 127.0.0.1 produced 24,166 distinct paths
# in 15 min — nothing else looks like that.
path_bruteforce:
  tiers:
    - distinct_paths: 200  # very aggressive bruteforce in current window
      points: 40
    - distinct_paths: 50   # mid-rate scanning
      points: 25
    - distinct_paths: 15   # opportunistic probe
      points: 10

# Wordlist paths: substring markers from common directory-busting lists
# (SecLists, nikto db_tests.db, dirsearch default.yml). A match scores once
# per request regardless of how many substrings hit.
wordlist_paths:
  points: 25
  substrings:
    # --- Nikto/Metasploitable legacy app paths ---
    - /forum1.asp
    - /forum_professionnel.asp
    - /rubrique.asp
    - /modif_infos.asp
    - /imprimer.asp
    - /modules.php
    - /postnuke/
    - /mambo/
    - /phpMyAdmin/
    - /phpmyadmin/
    - /pma/
    - /adminer.php
    # --- Tomcat / JMX / JBoss ---
    - /manager/html
    - /manager/jmxproxy
    - /jmx-console
    - /web-console
    - /admin-console
    - /invoker/
    - /status?full=true
    # --- CMS admin surfaces ---
    - /wp-admin/
    - /wp-login.php
    - /wp-content/plugins/
    - /wp-includes/
    - /administrator/index.php
    - /sugarcrm/
    - /AdaptCMS/
    - /solr/
    - /CDGServer3/
    # --- Leaked repo / config / backup files ---
    - /.git/
    - /.svn/
    - /.hg/
    - /.DS_Store
    - /.bash_history
    - /.npmrc
    - /.ssh/
    - /.aws/
    - /.env
    - /config.php
    - /configuration.php
    - /web.config
    - /WEB-INF/
    - /application.wadl
    - /api/swagger
    - /swagger-ui
    - /debug/pprof
    - /actuator
    - /console/
    - /install.php
    - /setup.php
    - /phpinfo.php
    - .bak
    - .old
    - .swp
    - .backup
    - .orig
    - "~admin"
    - "~root"
    - "~toor"
    - "~user"
    - "~www"
    - "~web"
    # --- JSF/Struts markers ---
    - /faces/javax.faces.resource
    - /struts2-showcase
    # --- Keycloak / OIDC harvesting ---
    - /realms/master/protocol/openid-connect
    # --- Shell / backdoor suffixes dropped by scan tools ---
    - /shell.jsp
    - /shell.php
    - /cmd.jsp
    - /c99.php
    - /r57.php

# Injection markers: strings that almost never appear in legitimate browser
# traffic but are hallmark nuclei/sqlmap/manual payloads. Scans the request
# path, query string, and the listed headers.
injection_markers:
  points: 45
  headers:
    - User-Agent
    - Referer
    - X-Forwarded-For
    - X-Forwarded-Host
    - X-Real-IP
    - X-Original-URL
    - X-Rewrite-URL
    - Host
    - Cookie
  substrings:
    # --- Log4Shell / JNDI ---
    - "${jndi:"
    - "${lower:"
    - "${upper:"
    - "${env:"
    - "${date:"
    - "${sys:"
    - "${::-j}"
    # --- Spring4Shell / OGNL / SpEL ---
    - class.module.classLoader
    - "%{(#"
    - "T(java.lang.Runtime)"
    # --- SSTI ---
    - "{{7*7}}"
    - "{{config"
    - "${7*7}"
    - "<%= 7*7 %>"
    # --- XSS ---
    - "<script"
    - "onerror="
    - "onload="
    - "javascript:"
    - "alert("
    - "alert(1)"
    - "prompt("
    - "document.cookie"
    # --- SQLi ---
    - " union select"
    - "union+select"
    - "UNION%20SELECT"
    - "' or "
    - "\" or "
    - " or 1=1"
    - "' OR '1"
    - "SLEEP("
    - "BENCHMARK("
    - "pg_sleep("
    - "WAITFOR DELAY"
    - "information_schema"
    - "ORDER BY 1--"
    # --- NoSQLi ---
    - "'$where'"
    - "'$ne'"
    - "'$regex'"
    # --- RCE / cmd injection ---
    - ";id"
    - "|id"
    - "&&id"
    - "`id`"
    - "$(id)"
    - "/bin/sh"
    - "/bin/bash"
    - "wget "
    - "curl "
    - "; cat /etc/"
    # --- Path traversal ---
    - "../"
    - "..%2f"
    - "..%2F"
    - "..\\"
    - "..%5c"
    - "/etc/passwd"
    - "/etc/shadow"
    - "boot.ini"
    # --- SSRF / localhost probing ---
    - "http://169.254.169.254"
    - "169.254.169.254/latest/meta-data"
    - "file:///etc/"
    - "gopher://"
    - "dict://"
    # --- CRLF / header injection ---
    - "%0d%0a"
    - "%0D%0A"
    - "\r\nSet-Cookie:"
    # --- Null byte / encoding tricks ---
    - "%00"
    - "\\x00"

# Out-of-band interaction hosts. Nuclei, Burp Collaborator, and projectdiscovery's
# interactsh all route callbacks through these domains. A request that contains
# one is almost certainly a template checking for blind SSRF/XXE/deserialization.
oob_interaction:
  points: 50
  substrings:
    - ".oast.me"
    - ".oast.online"
    - ".oast.pro"
    - ".oast.site"
    - ".oast.fun"
    - ".oast.live"
    - ".oastify.com"
    - ".burpcollaborator.net"
    - ".interact.sh"
    - ".requestbin.net"
    - ".requestbin.com"
    - ".webhook.site"
    - ".ngrok.io"
    - ".ngrok-free.app"
    - "canarytokens.com"
    - ".dnslog.cn"
    - ".interactsh"
