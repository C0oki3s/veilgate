# How the tarpit routes paths → templates, and how the payload injector
# picks what to slip into responses. This file replaces the hardcoded
# switch statement that used to live in internal/tarpit/handler.go and
# the magic-number knobs that used to live in cmd/veilgate/main.go.

# Route table. First match wins. `match:` is one of:
#   - prefix:   path has this prefix (case-insensitive)
#   - exact:    path equals this (case-insensitive)
#   - contains: path contains this substring (case-insensitive)
#   - sqli:     path or query matches vulnerabilities.sql_injection_patterns
#   - regex:    Go regexp syntax (anchored is your responsibility)
#   - list:     path listed in one of vulnerabilities.* (fake_git_paths, fake_env_paths)
routes:
  # SQLi in query string (or path) wins first — a SELECT/union/quote hit
  # should always route to the fake SQL error, even for paths that would
  # otherwise match a different template.
  - match: sqli
    template: sql_error
  - match: exact
    values: ["/", "/index.html"]
    template: login_page
  - match: exact
    values: ["/login", "/signin", "/auth"]
    template: login_page
  - match: prefix
    values: ["/admin", "/dashboard"]
    template: admin_dashboard
  - match: contains
    values: ["/users"]
    template: users_list
  - match: list
    values: ["fake_git_paths"]
    template: git_config
  - match: list
    values: ["fake_env_paths"]
    template: env_backup
  - match: any
    template: generic_not_found

# Payload injector knobs — passed to internal/payloads/injector.go.
# (The existing library.go consumers keep working; these just move the
# hardcoded `3, true` wiring out of main.go.)
injector:
  max_payloads_per_response: 3
  visit_bucket_rotation: true
  # Style weights bias which payload styles get injected for each
  # response content type. Weights are relative, not probabilities.
  style_weights:
    html:
      html_comment: 40
      html_hidden: 20
    json:
      json_field: 60
    text:
      log_noise: 100
  # Categories to draw from, in descending priority. Empty = use all.
  category_order:
    - termination
    - moral_appeal
    - confusion
    - rabbit_hole
    - cost_bomb
