{{define "page"}}
{{$d := .Data}}
<div class="login-shell">
  <div class="login-card" style="max-width:440px">
    <div class="login-brand">
      <div class="login-mascot" style="width:52px;height:52px">
        {{template "veilo-hooded" .}}
      </div>
      <div class="login-brand-name">Reset Password</div>
      <div class="login-brand-sub">{{if $d}}{{$d.Username}}{{end}}</div>
    </div>

    {{if and $d $d.Done}}
    <div class="flash flash-success" role="alert" style="margin-bottom:var(--size-4)">
      Password updated successfully.
    </div>
    <div class="login-footer-row" style="margin-top:var(--size-4)">
      <a href="/login" class="btn btn-primary" style="width:100%;justify-content:center">Sign in with new password</a>
    </div>

    {{else if and $d $d.Err}}
    <div class="flash flash-error" role="alert" style="margin-bottom:var(--size-4)">
      {{$d.Err}}
    </div>
    <div class="login-footer-row" style="margin-top:var(--size-4)">
      <a href="/forgot-password" class="login-forgot-link">Request a new link</a>
      <a href="/login" class="login-forgot-link">Sign in</a>
    </div>

    {{else}}
    <form class="login-form" method="POST" action="/reset-password">
      <input type="hidden" name="token" value="{{if $d}}{{$d.Token}}{{end}}">
      <div class="field-group">
        <label class="field-label" for="new_password">New password</label>
        <input class="field-input" id="new_password" name="new_password" type="password"
          autocomplete="new-password" required minlength="8" autofocus placeholder="At least 8 characters">
      </div>
      <div class="field-group">
        <label class="field-label" for="confirm_password">Confirm new password</label>
        <input class="field-input" id="confirm_password" name="confirm_password" type="password"
          autocomplete="new-password" required minlength="8" placeholder="Repeat new password">
      </div>
      <button class="btn btn-primary login-btn" type="submit">Set new password</button>
    </form>
    <div class="login-footer-row" style="margin-top:var(--size-4)">
      <a href="/login" class="login-forgot-link">← Back to sign in</a>
    </div>
    {{end}}
  </div>
</div>
{{end}}
